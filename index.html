<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hornera</title>
    <style>
      /* Fila desplegada de una tabla y su detalle: se distinguen de las cerradas (tema "Ladrillo"). */
      .fila-abierta > td { background: #F3E3D9 !important; font-weight: 600; transition: none !important; }
      .fila-abierta > td:first-child { box-shadow: inset 4px 0 0 #A8461F; }
      /* Modales: título separado del formulario y botones abajo con línea, como una ficha. */
      .ant-modal .ant-modal-header { border-bottom: 1px solid #E6DED3 !important; padding-bottom: 12px !important; margin-bottom: 18px !important; }
      .ant-modal .ant-modal-footer { border-top: 1px solid #E6DED3 !important; padding-top: 14px !important; margin-top: 20px !important; }
      /* Resumen arriba de un formulario (a quién, cuánto). */
      .ficha { background: #FBF4EF; border: 1px solid #E6DED3; border-radius: 6px; padding: 12px 16px; margin-bottom: 18px;
        display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: baseline; }
      .ficha > dt { color: #6E6259; margin: 0; }
      .ficha > dd { margin: 0; }
      /* Asistente: la pregunta a la derecha, la respuesta a lo ancho; tablas de la IA con líneas. */
      .burbuja-ia { padding: 8px 12px; border-radius: 8px; background: #FBF4EF; border: 1px solid #E6DED3; overflow-x: auto; }
      .burbuja-ia-usuario { margin: 0 0 6px auto; width: fit-content; max-width: 85%; background: #F3E3D9; white-space: pre-wrap; }
      .tabla-ia { border-collapse: collapse; margin: 0 0 8px; font-size: 13px; }
      .tabla-ia th, .tabla-ia td { border: 1px solid #E6DED3; padding: 3px 8px; }
      .tabla-ia th { background: #F6EEE7; }
      .detalle-abierto > td { background: #FBF4EF !important; box-shadow: inset 4px 0 0 #A8461F; }
      /* Subtotales y totales de las tablas del detalle (la cuenta, el total de reservas). */
      .subtotal > td { background: #F6EEE7 !important; }
      /* Tablas del detalle: borde de afuera, renglones y línea bajo la cabecera más marcados. */
      .detalle-abierto .ant-table { border: 2px solid #E6DED3; border-radius: 6px; overflow: hidden; }
      .detalle-abierto .ant-table-tbody > tr > td, .detalle-abierto .ant-table-summary td { border-bottom: 2px solid #EDE5DC !important; }
      .detalle-abierto table:not(:has(tfoot)) > .ant-table-tbody > tr:last-child > td,
      .detalle-abierto .ant-table-summary tr:last-child td { border-bottom: none !important; }
      .detalle-abierto .ant-table-thead > tr > th { border-bottom: 2px solid #CDBFAF !important; }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
