<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hornera</title>
    <style>
      /* Fila desplegada de una tabla y su detalle: se distinguen de las cerradas (tema "Ladrillo"). */
      .fila-abierta > td { background: #F3E3D9 !important; font-weight: 600; transition: none !important; }
      .fila-abierta > td:first-child { box-shadow: inset 4px 0 0 #A8461F; }
      /* Modales: título separado del formulario y botones abajo con línea, como una ficha. */
      .ant-modal .ant-modal-header { border-bottom: 1px solid #E6DED3 !important; padding-bottom: 12px !important; margin-bottom: 18px !important; }
      .ant-modal .ant-modal-footer { border-top: 1px solid #E6DED3 !important; padding-top: 14px !important; margin-top: 20px !important; }
      /* Resumen arriba de un formulario (a quién, cuánto). */
      .ficha { background: #FBF4EF; border: 1px solid #E6DED3; border-radius: 6px; padding: 12px 16px; margin-bottom: 18px;
        display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: baseline; }
      .ficha > dt { color: #6E6259; margin: 0; }
      .ficha > dd { margin: 0; }
      /* Asistente, como la app de Claude: la pregunta en una burbuja a la derecha; la respuesta sin caja, texto a lo ancho. */
      .pregunta-ia { margin: 0 0 12px auto; width: fit-content; max-width: 85%; padding: 8px 14px; border-radius: 14px;
        background: #F3E3D9; white-space: pre-wrap; }
      .tarjetas-kpi { container-type: inline-size; width: 100%; }
      .tarjetas-kpi > div { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      @container (min-width: 640px) { .tarjetas-kpi > div { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      @container (min-width: 1130px) { .tarjetas-kpi > div { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
      .campo-ia { border: 1px solid #D9CFC4; border-radius: 12px; background: #fff; padding: 6px 8px; }
      .campo-ia { transition: border-color .2s, box-shadow .2s; }
      .campo-ia:focus-within { border-color: #A8461F; box-shadow: 0 0 0 3px rgba(168, 70, 31, .12); }
      /* Un solo borde: el del recuadro. El texto de adentro no marca su propio foco. */
      .campo-ia textarea, .campo-ia textarea:focus, .campo-ia textarea:hover { border: 0 !important; outline: none !important; box-shadow: none !important; background: transparent !important; }
      .reciente-ia { all: unset; box-sizing: border-box; width: 100%; display: flex; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #EDE6DE; cursor: pointer; border-radius: 6px; }
      .reciente-ia:hover { background: #F5EFE9; }
      .reciente-ia:focus-visible { outline: 2px solid #B5835A; }
      .md-ia { font-size: 14px; line-height: 1.65; overflow-x: auto; }
      .md-ia > :first-child { margin-top: 0; }
      .md-ia > :last-child { margin-bottom: 0; }
      .md-ia p { margin: 0 0 0.8em; }
      .md-ia h1, .md-ia h2, .md-ia h3, .md-ia h4 { font-weight: 600; line-height: 1.3; margin: 1.1em 0 0.5em; }
      .md-ia h1 { font-size: 1.3em; } .md-ia h2 { font-size: 1.15em; } .md-ia h3, .md-ia h4 { font-size: 1em; }
      .md-ia ul, .md-ia ol { margin: 0 0 0.8em; padding-left: 1.5em; }
      .md-ia li { margin: 0.25em 0; }
      .md-ia li > ul, .md-ia li > ol { margin: 0.25em 0 0; }
      .md-ia strong { font-weight: 600; }
      .md-ia code { font-family: Consolas, monospace; font-size: 0.88em; background: #F5EFE9; border: 1px solid #EAE1D8;
        border-radius: 4px; padding: 1px 5px; }
      .md-ia pre { background: #F5EFE9; border: 1px solid #EAE1D8; border-radius: 8px; padding: 10px 12px; overflow-x: auto; margin: 0 0 0.8em; }
      .sql-ia { white-space: pre-wrap; background: #F5EFE9; padding: 6px; margin: 2px 0 0; }
      .md-ia pre code { background: none; border: 0; padding: 0; }
      .md-ia blockquote { margin: 0 0 0.8em; padding-left: 12px; border-left: 3px solid #E6DED3; color: #6E6259; }
      .md-ia hr { border: 0; border-top: 1px solid #E6DED3; margin: 1em 0; }
      .md-ia table { border-collapse: collapse; margin: 0 0 0.8em; font-size: 13px; font-variant-numeric: tabular-nums; }
      .md-ia th, .md-ia td { padding: 6px 12px; border-bottom: 1px solid #EAE1D8; text-align: left; }
      .md-ia th { font-weight: 600; border-bottom: 2px solid #E6DED3; }
      .md-ia th[align="right"], .md-ia td[align="right"] { text-align: right; }
      .md-ia tbody tr:last-child td { border-bottom: 0; }
      .detalle-abierto > td { background: #FBF4EF !important; box-shadow: inset 4px 0 0 #A8461F; }
      /* Subtotales y totales de las tablas del detalle (la cuenta, el total de reservas). */
      .subtotal > td { background: #F6EEE7 !important; }
      /* Tablas del detalle: borde de afuera, renglones y línea bajo la cabecera más marcados. */
      .detalle-abierto .ant-table { border: 2px solid #E6DED3; border-radius: 6px; overflow: hidden; }
      .detalle-abierto .ant-table-tbody > tr > td, .detalle-abierto .ant-table-summary td { border-bottom: 2px solid #EDE5DC !important; }
      .detalle-abierto table:not(:has(tfoot)) > .ant-table-tbody > tr:last-child > td,
      .detalle-abierto .ant-table-summary tr:last-child td { border-bottom: none !important; }
      .detalle-abierto .ant-table-thead > tr > th { border-bottom: 2px solid #CDBFAF !important; }
    </style>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
